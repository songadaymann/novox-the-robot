[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "novox"
version = "0.1.0"
description = "Formant singing synthesizer: type lyrics, give it a melody, it sings (in the spirit of Myriad's Virtual Singer)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jonathan Mann" }]
keywords = ["singing synthesis", "formant synthesis", "vocal", "music", "tts"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

[project.optional-dependencies]
numpy = ["numpy"]

[project.scripts]
novox = "novox.__main__:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
wheel.packages = ["bindings/python/novox"]
wheel.py-api = "py3"   # the engine is loaded with ctypes: one wheel for every Python 3
build.targets = ["novox_shared"]
install.components = ["python"]
sdist.exclude = ["out", "reference", "build", "tools/.venv", "mockups"]

[tool.scikit-build.cmake.define]
NOVOX_BUILD_CLI = "OFF"
NOVOX_BUILD_TESTS = "OFF"
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
